<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="style.css?v=25">
</head>

<body>

    <div class="admin-layout">

        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="logo"><img src="AQUAVIDA_WORD.png" alt="AQUAVIDA" class="logo-word"></div>

            <div class="admin-sidebar-buttons">
                <button class="admin-nav-btn active" data-section="overview">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
                    <span>Overview</span>
                </button>
                <button class="admin-nav-btn" data-section="bookings">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"></path><rect x="4" y="6" width="16" height="14" rx="2"></rect><path d="M8 11h3v3H8z"></path><path d="M13 11h3M13 14h3"></path></svg>
                    <span>Bookings</span>
                </button>
                <button class="admin-nav-btn" data-section="trips">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
                    <span>Trips</span>
                </button>
                <button class="admin-nav-btn" data-section="boats">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 17c1.5 0 2.5-1 4-1s2.5 1 4 1 2.5-1 4-1 2.5 1 4 1"></path><path d="M4 16l1.5-4.5A2 2 0 0 1 7.4 10H18a2 2 0 0 1 1.8 1.2L21 16"></path><path d="M12 3v4M9 5h6"></path></svg>
                    <span>Boats</span>
                </button>
                <button class="admin-nav-btn" data-section="operators">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c1.4-3.4 4-5 7-5s5.6 1.6 7 5"></path></svg>
                    <span>Operators</span>
                </button>
                <button class="admin-nav-btn" data-section="customers">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="9" r="3"></circle><circle cx="17" cy="10" r="2.4"></circle><path d="M3 19c1.2-3 3.4-4.5 6-4.5S13.8 16 15 19"></path><path d="M15.5 14.6c2.5.2 4.4 1.7 5.5 4.4"></path></svg>
                    <span>Customers</span>
                </button>
                <button class="admin-nav-btn" data-section="revenue">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><path d="M16.5 7.5c0-1.7-2-2.5-4.5-2.5S7.5 5.8 7.5 7.5 9.5 10 12 10s4.5.8 4.5 3-2 2.5-4.5 2.5-4.5-.8-4.5-2.5"></path></svg>
                    <span>Revenue</span>
                </button>
                <button class="admin-nav-btn" data-section="expenses">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 2h12a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"></path><path d="M9 7h6M9 11h6M9 15h4"></path></svg>
                    <span>Monthly Expenses</span>
                </button>
            </div>

            <div class="admin-sidebar-footer">
                <a href="index.html">View Site</a>
                <a href="#" id="logout-btn">Logout</a>
            </div>
            <a href="owner-login.html" class="admin-btn">Login</a>
        </aside>

        <!-- Main Content -->
        <main id="admin-content" class="admin-main">
            <p style="text-align: center; padding: 50px;">Loading...</p>
        </main>

    </div>

    <script type="module" src="admin.js?v=8"></script>

</body>

</html>
