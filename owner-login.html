<body>

    <!-- Navigation -->
    <nav>
        <div class="logo"><img src="AQUAVIDA_WORD.png?v=2" alt="AQUAVIDA" class="logo-word" width="500" height="87" decoding="async"></div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="trips.html">Trips</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
            <a href="fleet.html">Our Fleet</a>
        </div>
    </nav>


    <!-- Login Form -->
    <section class="login-section">

        <div class="login-box">

            <h1>Owner Login</h1>

            <p class="section-description">
                Sign in to manage your trips and bookings
            </p>

            <p class="owner-login-note" id="owner-login-note" hidden>
                This account does not have dashboard access.
            </p>

            <form id="login-form">
                <label>
                    Email:
                    <input type="email" id="login-email" required>
                </label>

                <label>
                    Password:
                    <input type="password" id="login-password" required>
                </label>

                <p id="login-error" class="error-message"></p>

                
                <button type="submit" class="book-btn">Login</button>
                

            </form>

        </div>

    </section>

    <script type="module" src="owner-login.js?v=3"></script>

</body>
